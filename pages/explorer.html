rgin-top: 5px"></fluent-listbox><fluent-button id="import-timetable-json-btn" class="explorer-item" onclick="schedule.importTimeTemplateJSONUI()" style="display: flex; margin-top: 5px"><i class="bi bi-filetype-json"></i>&nbsp;导入JSON</fluent-button></fluent-tab-panel><fluent-tab-panel id="subjectBPanel"><fluent-listbox id="subject-list" style="margin-top: 5px"></fluent-listbox></fluent-tab-panel></fluent-tabs><div class="subuser-hint" id="subuser-instance-caption" style="display: none"></div><fluent-listbox id="cloud-list" style="display: block"></fluent-listbox></div></body></html>
